<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Rolar Dados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: #eee;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.tabs {
    display: flex;
    justify-content: center;
    margin-bottom: 15px;
}

.tabs button {
    padding: 10px 20px;
    border: none;
    background: #333;
    color: #fff;
    cursor: pointer;
    margin: 0 5px;
}

.tabs button.active {
    background: #6200ea;
}

.section {
    display: none;
    max-width: 900px;
    margin: auto;
}

.section.active {
    display: block;
}

.controls {
    text-align: center;
    margin-bottom: 15px;
}

.dice-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.dice {
    width: 100px;
    cursor: pointer;
    transition: transform 0.1s;
}

.dice:hover {
    transform: scale(1.05);
}

.result {
    text-align: center;
    font-size: 1.5em;
    margin-top: 15px;
}

.history {
    margin-top: 20px;
    background: #1e1e1e;
    padding: 10px;
    max-height: 200px;
    overflow-y: auto;
}

.history div {
    border-bottom: 1px solid #333;
    padding: 5px 0;
}

.sum-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 5px 0;
}
</style>
</head>

<body>

    <h1>🎲 Rolar Dados</h1>

    <div class="tabs">
        <button class="active" onclick="openTab('roll', event)">Rolagem</button>
        <button onclick="openTab('sum', event)">Soma de Dados</button>
    </div>

    <div id="roll" class="section active">

        <div class="controls">
            Vantagem / Desvantagem:
            <input type="number" id="modifier" value="1" style="width:60px;" onchange="validateModifier()">
            <button onclick="clearHistory()">Limpar Histórico</button>
        </div>

        <div class="dice-container" id="diceContainer"></div>

        <div class="result" id="result">Resultado: -</div>

        <div class="history" id="history"></div>
    </div>

    <div id="sum" class="section">

        <div id="sumControls"></div>

        <div class="controls">
            <button onclick="rollSum()">Rolar Soma</button>
            <button onclick="clearSumHistory()">Limpar Histórico</button>
        </div>

        <div class="result" id="sumResult">Soma Total: -</div>

        <div class="history" id="sumHistory"></div>
    </div>

    <audio id="rollSound" src="assets/som/roll.wav" preload="auto"></audio>

<script>
    const DICE = {
        D20: 20,
        D12: 12,
        D10: 10,
        D8: 8,
        D6: 6,
        D4: 4
    };

    const IMAGE_BASE = "https://raw.githubusercontent.com/Jhonatan-Orlandi-de-Abrantes/Rolar-Dados/main/assets/imagens/";

    const historyKey = "diceHistory";
    const sumHistoryKey = "diceSumHistory";

    const historyEl = document.getElementById("history");
    const sumHistoryEl = document.getElementById("sumHistory");
    const resultEl = document.getElementById("result");
    const rollSound = document.getElementById("rollSound");

    // Função para abrir abas - agora recebe event para manipular a classe active do botão corretamente
    function openTab(id, ev) {
        document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        if (ev && ev.currentTarget) {
            ev.currentTarget.classList.add("active");
        } else if (ev && ev.target) {
            ev.target.classList.add("active");
        }
    }

    const diceContainer = document.getElementById("diceContainer");

    for (let dice in DICE) {
        const img = document.createElement("img");
        // A URL das imagens no repositório está no IMAGE_BASE; se você preferir usar local: "assets/imagens/..."
        img.src = IMAGE_BASE + dice.toLowerCase() + ".png";
        img.className = "dice";
        img.alt = dice;
        img.onclick = () => rollDice(dice);
        diceContainer.appendChild(img);
    }

    function loadHistory() {
        return JSON.parse(localStorage.getItem(historyKey)) || [];
    }

    function saveHistory(history) {
        localStorage.setItem(historyKey, JSON.stringify(history));
    }

    function renderHistory() {
        historyEl.innerHTML = "";
        loadHistory().slice().reverse().forEach(h => {
            const div = document.createElement("div");
            div.textContent = `${h.datetime} | ${h.dice} | ${h.result}`;
            historyEl.appendChild(div);
        });
    }

    function clearHistory() {
        localStorage.removeItem(historyKey);
        renderHistory();
    }

    function loadSumHistory() {
        return JSON.parse(localStorage.getItem(sumHistoryKey)) || [];
    }

    function saveSumHistory(history) {
        localStorage.setItem(sumHistoryKey, JSON.stringify(history));
    }

    function renderSumHistory() {
        sumHistoryEl.innerHTML = "";
        loadSumHistory().slice().reverse().forEach(h => {
            const div = document.createElement("div");
            div.textContent = `${h.datetime} | Total: ${h.total}`;
            sumHistoryEl.appendChild(div);
        });
    }

    function clearSumHistory() {
        localStorage.removeItem(sumHistoryKey);
        renderSumHistory();
    }

    // Função auxiliar para tocar o som com reset e tratamento de promise
    function playRollSound() {
        if (!rollSound) return;
        try {
            rollSound.currentTime = 0;
            const playPromise = rollSound.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    // Alguns navegadores exigem interação; log para debugging
                    console.warn("Erro ao tocar o som:", err);
                });
            }
        } catch (err) {
            console.warn("Não foi possível tocar o som:", err);
        }
    }

    function validateModifier() {
        const modInput = document.getElementById("modifier");
        let value = parseInt(modInput.value) || 0;
        // Se for 0, muda para 1
        if (value === 0) {
            modInput.value = "1";
        }
    }

    function rollDice(dice) {
        // toca som ao rolar
        playRollSound();

        const sides = DICE[dice];
        let mod = parseInt(document.getElementById("modifier").value) || 1;
        // Se for 0, força para 1
        if (mod === 0) {
            mod = 1;
        }
        let rolls = Math.abs(mod);

        let results = [];
        for (let i = 0; i < rolls; i++) {
            results.push(Math.floor(Math.random() * sides) + 1);
        }

        let final = mod > 0 ? Math.max(...results)
                : mod < 0 ? Math.min(...results)
                : results[0];

        const sign = mod > 0 ? '+' : '';
        resultEl.textContent = `${dice}: ${final} - Rolagens ${sign}${mod}`;

        const history = loadHistory();
            history.push({
                datetime: new Date().toLocaleString(),
                dice,
                modifier: mod,
                result: final,
                rolls: results
            });

            saveHistory(history);
            renderHistory();
        }

        const sumControls = document.getElementById("sumControls");

        for (let dice in DICE) {
            const row = document.createElement("div");
            row.className = "sum-row";
            row.innerHTML = `
                <label>${dice}</label>
                <input type="number" min="0" value="0" id="sum-${dice}" style="width:60px;">
            `;
            sumControls.appendChild(row);
        }

        function rollSum() {
            // toca som ao rolar soma
            playRollSound();

            let total = 0;
            let details = [];

            for (let dice in DICE) {
                const count = parseInt(document.getElementById(`sum-${dice}`).value) || 0;
                for (let i = 0; i < count; i++) {
                    let roll = Math.floor(Math.random() * DICE[dice]) + 1;
                    total += roll;
                    details.push(`${dice}:${roll}`);
                }
            }

            document.getElementById("sumResult").textContent = `Soma Total: ${total} | ${details.join(", ")}`;

            const sumHistory = loadSumHistory();
            sumHistory.push({
                datetime: new Date().toLocaleString(),
                total: total,
                details: details
            });
            saveSumHistory(sumHistory);
            renderSumHistory();
        }

        renderHistory();
        renderSumHistory();
</script>

</body>
</html>
